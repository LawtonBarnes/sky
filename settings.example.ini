# SKY settings -- copy to settings.ini (untracked, per machine).

[sky]
# NOAA STAR image directory for the sector to loop, and which of its
# image sizes to download.
source_url = https://cdn.star.nesdis.noaa.gov/GOES19/ABI/SECTOR/sp/GEOCOLOR/
image_size = 600x600
# How much history the loop covers, measured back from the newest frame.
hours = 24
# Playback speed in frames per second (NOAA frames are 5 minutes apart,
# so 15 fps plays a day in ~19s). Left/Right on the remote steps through
# 5/10/15/20/30 and saves it here.
fps = 15
# Pause on the newest frame before the loop starts over.
hold_seconds = 1.0
# Which 4:3 slice of the square frame to show: top, center or bottom.
# center keeps out NOAA's caption bar and logo; top does too, and puts
# DFW dead center. Changing it means clearing cache/ so frames rebuild.
crop = center
